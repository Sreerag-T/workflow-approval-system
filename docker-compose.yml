# Optional: run MySQL without installing it.  docker compose up -d
services:
  mysql:
    image: mysql:8.0
    container_name: workflow-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: workflow_approval
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
volumes:
  mysql_data:
